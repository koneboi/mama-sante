paths:
  raw: data/raw
  processed: data/processed
  images: data/images
  geo: data/geo
  models: models

risk:
  feature_cols:
    - age
    - family_history
    - prior_biopsy
    - palpability
    - symptom_duration_months
    - rural_flag
    - wealth_quartile
  target_col: label
  model: gradient_boosting
  risk_threshold: 0.5

imaging:
  backbone: mobilenet_v3_small
  input_size: 224
  num_classes: 3          # benign, suspicious, malignant
  modality: ultrasound
  confidence_floor: 0.65

triage:
  levels:
    - wait
    - local_scan
    - regional_imaging
    - urgent_biopsy
  escalate_threshold: 0.8

routing:
  weights:
    travel_km: 0.2
    travel_h: 40.0
    out_of_pocket: 0.05
    center_load: 0.02
  max_travel_ratio: 1.5
  center_levels:
    - post
    - district
    - regional
    - hospital
